[pytest]
markers =
    mtln: tests which use mtln features.
    mtln_standalone: mtlnProblem:true standalone MTLN (cpp_build_mtln Tier 1 only).
    codemodel: test that need xspice codemodels.
    hdf: tests that need hdf5.
    mpi: tests to be run with mpirun
    # Feature tags
    wires: tests for wire/multiwire models
    lumped: tests for lumped elements (resistor, capacitor, inductor)
    probes: tests for probe types (point, bulk, far-field, movie)
    planewave: tests for plane wave sources
    pml: tests for PML/CPML absorbing boundaries
    conformal: tests for conformal mapping
    sgbc: tests for surface impedance boundary conditions
    dielectric: tests for dielectric materials
    nodal_source: tests for nodal current sources
    termination: tests for wire terminations (open, short, resistive)
    multiwire: tests for shielded/unshielded multiwire bundles
    spice: tests for SPICE coupling (diodes, opamps, zeners)
    farfield: tests for near-to-far field transformation
    movie: tests for movie probes (time-resolved field snapshots)
    vtk: tests for VTK output
    cpp_migration: tests compatible with the current C++ migration executable gate
    performance: opt-in runtime benchmark metrics; skipped unless SEMBA_RUN_PERFORMANCE_BENCHMARK=1
