name: cpp

on:
  push:
    branches:
      - main
      - dev
      - cpp
    paths:
      - 'src/**'
      - 'src_cpp/**'
      - 'pyWrapper/**'
      - 'cpp_build.cmake'
      - 'CMakeLists.txt'
      - 'scripts/test_cpp_*.sh'
      - 'test/cpp/**'
      - 'test/pyWrapper/**'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/cpp.yml'
  pull_request:
    branches:
      - main
      - dev
      - cpp
    paths:
      - 'src/**'
      - 'src_cpp/**'
      - 'pyWrapper/**'
      - 'cpp_build.cmake'
      - 'CMakeLists.txt'
      - 'scripts/test_cpp_*.sh'
      - 'test/cpp/**'
      - 'test/pyWrapper/**'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/cpp.yml'

concurrency:
  group: cpp-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nomtln-migration:
    name: no-MTLN migration gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run no-MTLN C++ gate
        run: ./scripts/test_cpp_nomtln.sh

  hdf-output:
    name: HDF movie output gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libhdf5-dev

      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run HDF C++ gate
        run: chmod +x scripts/test_cpp_hdf.sh && ./scripts/test_cpp_hdf.sh

  mtln-migration:
    name: MTLN Tier 1 migration gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ liblapack-dev libblas-dev

      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run MTLN C++ gate
        run: ./scripts/test_cpp_mtln.sh
