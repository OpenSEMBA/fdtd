name: cpp

on:
  push:
    branches:
      - main
      - dev
      - cpp
    paths:
      - 'src/**'
      - 'src_cpp/**'
      - 'pyWrapper/**'
      - 'cpp_build.cmake'
      - 'CMakeLists.txt'
      - 'test/cpp/**'
      - 'test/pyWrapper/**'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/cpp.yml'
  pull_request:
    branches:
      - main
      - dev
      - cpp
    paths:
      - 'src/**'
      - 'src_cpp/**'
      - 'pyWrapper/**'
      - 'cpp_build.cmake'
      - 'CMakeLists.txt'
      - 'test/cpp/**'
      - 'test/pyWrapper/**'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/cpp.yml'

concurrency:
  group: cpp-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nomtln-migration:
    name: no-MTLN migration gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Configure and build C++ (no MTLN)
        run: |
          cmake -S . -B cpp_build_nomtln \
            -DSEMBA_FDTD_BUILD_CXX=ON \
            -DSEMBA_FDTD_ENABLE_MTLN=OFF \
            -DSEMBA_FDTD_ENABLE_MPI=OFF \
            -DSEMBA_FDTD_ENABLE_HDF=OFF \
            -DSEMBA_FDTD_COMPONENTS_LIB=OFF \
            -DSEMBA_FDTD_OUTPUTS_LIB=OFF \
            -DSEMBA_FDTD_MAIN_LIB=ON \
            -DSEMBA_FDTD_EXECUTABLE=ON \
            -DSEMBA_FDTD_ENABLE_TEST=ON
          cmake --build cpp_build_nomtln -j --target semba-fdtd-cpp cpp_tests

      - name: GoogleTest (no-MTLN migration)
        run: |
          cpp_build_nomtln/bin/cpp_tests --gtest_filter=SystemInitSolver.*
          cpp_build_nomtln/bin/cpp_tests \
            '--gtest_filter=-HollandWire.*:BordersMur.MurCxMatchesFortranCalcMurconstants310:PlanewavePwInBox.ProbeFilesExact_First120Steps:PlanewavePwInBox.ProbeFilesExact_FullRun:PlanewavePwInBox.PeriodicProbeFilesExact_FullRun'

      - name: pytest (cpp_migration)
        env:
          SEMBA_EXE: ${{ github.workspace }}/cpp_build_nomtln/bin/semba-fdtd-cpp
          SEMBA_FDTD_ENABLE_MTLN: OFF
          SEMBA_FDTD_ENABLE_MPI: OFF
          SEMBA_FDTD_ENABLE_HDF: OFF
        run: PYTHONPATH=. python3 -m pytest test/pyWrapper/ -m cpp_migration -x -v

  hdf-output:
    name: HDF movie output gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libhdf5-dev

      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Configure and build C++ (HDF)
        run: |
          cmake -S . -B cpp_build_hdf \
            -DSEMBA_FDTD_BUILD_CXX=ON \
            -DSEMBA_FDTD_ENABLE_MTLN=OFF \
            -DSEMBA_FDTD_ENABLE_MPI=OFF \
            -DSEMBA_FDTD_ENABLE_HDF=ON \
            -DSEMBA_FDTD_COMPONENTS_LIB=OFF \
            -DSEMBA_FDTD_OUTPUTS_LIB=ON \
            -DSEMBA_FDTD_MAIN_LIB=ON \
            -DSEMBA_FDTD_EXECUTABLE=ON \
            -DSEMBA_FDTD_ENABLE_TEST=ON
          cmake --build cpp_build_hdf -j --target semba-fdtd-cpp semba-outputs cpp_tests

      - name: GoogleTest (XdmfH5)
        run: cpp_build_hdf/bin/cpp_tests --gtest_filter=XdmfH5.*

      - name: pytest (hdf)
        env:
          SEMBA_EXE: ${{ github.workspace }}/cpp_build_hdf/bin/semba-fdtd-cpp
          SEMBA_FDTD_ENABLE_MTLN: OFF
          SEMBA_FDTD_ENABLE_MPI: OFF
          SEMBA_FDTD_ENABLE_HDF: ON
        run: PYTHONPATH=. python3 -m pytest test/pyWrapper/ -m hdf -x -v

  mtln-migration:
    name: MTLN Tier 1 migration gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ liblapack-dev libblas-dev

      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Configure and build C++ (MTLN)
        run: |
          cmake -S . -B cpp_build_mtln \
            -DSEMBA_FDTD_BUILD_CXX=ON \
            -DSEMBA_FDTD_ENABLE_MTLN=ON \
            -DSEMBA_FDTD_ENABLE_MPI=OFF \
            -DSEMBA_FDTD_ENABLE_HDF=OFF \
            -DSEMBA_FDTD_COMPONENTS_LIB=OFF \
            -DSEMBA_FDTD_MAIN_LIB=ON \
            -DSEMBA_FDTD_OUTPUTS_LIB=OFF \
            -DSEMBA_FDTD_EXECUTABLE=ON \
            -DSEMBA_FDTD_ENABLE_TEST=ON
          cmake --build cpp_build_mtln -j --target cpp_tests semba-fdtd-cpp

      - name: GoogleTest (MTLN unit)
        run: |
          cpp_build_mtln/bin/cpp_tests '--gtest_filter=mtln.*'
          cpp_build_mtln/bin/cpp_tests '--gtest_filter=smbjson_cpp.read_*mtln*:smbjson_cpp.read_shieldedpair:smbjson_cpp.read_connectedwires:smbjson_cpp.read_paul_*'
          cpp_build_mtln/bin/cpp_tests '--gtest_filter=rotate.rotate_mtln_test'

      - name: pytest (mtln_standalone)
        env:
          SEMBA_EXE: ${{ github.workspace }}/cpp_build_mtln/bin/semba-fdtd-cpp
          SEMBA_FDTD_ENABLE_MTLN: ON
          SEMBA_FDTD_ENABLE_MPI: OFF
          SEMBA_FDTD_ENABLE_HDF: OFF
        run: PYTHONPATH=. python3 -m pytest test/pyWrapper/test_mtln_standalone.py -m mtln_standalone -v
