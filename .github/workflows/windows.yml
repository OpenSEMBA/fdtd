name: windows


on:
  push:
    branches:
      - main

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  builds-and-tests:
    strategy:
      matrix:
        os: [windows-latest]
        compiler: [ 
          {name: 'intel', version: '2025.2.1'} 
        ]
        build-type: ["Release"]
        mpi: ["OFF"]
        mtln: ["ON", "OFF"]
        double-precision: ["ON", "OFF"]

      fail-fast: false
    runs-on: ${{matrix.os}}

    name: ${{matrix.os}} / ${{matrix.compiler.name}} / ${{matrix.build-type}}-mpi(${{matrix.mpi}})-mtln(${{matrix.mtln}})-double(${{matrix.double-precision}})

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Install python wrapper requirements
      run: python -m pip install -r requirements.txt
        
    #- name: Setup MPI
    #  uses: mpi4py/setup-mpi@v1
    #  with:
    #    mpi: 'intelmpi'

    - name: Setup intel fortran
      uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: ${{ matrix.compiler.name }}
        version: ${{ matrix.compiler.version }}

    # ifx requires MSVC's linker and Windows SDK environment on the hosted runner.
    - name: Setup MSVC toolchain
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    # CMake 4.4 cannot detect the ifx 2025.2 Fortran preprocessor on Windows.
    - name: Setup CMake
      shell: pwsh
      run: |
        $archive = "$env:RUNNER_TEMP\cmake-3.31.6-windows-x86_64.zip"
        $directory = "$env:RUNNER_TEMP\cmake-3.31.6-windows-x86_64"
        Invoke-WebRequest -Uri https://cmake.org/files/v3.31/cmake-3.31.6-windows-x86_64.zip -OutFile $archive
        Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP
        "$directory\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: CMake build
      shell: bash
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}} \
          -DSEMBA_FDTD_ENABLE_MPI=${{matrix.mpi}} \
          -DSEMBA_FDTD_ENABLE_MTLN=${{matrix.mtln}} \
          -DSEMBA_FDTD_ENABLE_DOUBLE_PRECISION=${{matrix.double-precision}} \
          -DHDF5_DIR="$PWD/precompiled_libraries/windows-intel/hdf5/cmake" \
          -DHDF5_USE_STATIC_LIBRARIES=ON
        cmake --build build -j 

    - name: Run ctest
      id: ctest
      continue-on-error: true
      run: ctest --test-dir build --output-on-failure

    - name: Run HDF movie smoke test
      id: hdf-smoke
      continue-on-error: true
      run: python -m pytest test/pyWrapper/test_full_system.py::test_movie_in_planewave_in_box --basetemp=build/hdf-smoke

    - name: Run python tests (except codemodel)
      id: python-tests
      continue-on-error: true
      env:
        SEMBA_FDTD_ENABLE_MPI: ${{ matrix.mpi }}
        SEMBA_FDTD_ENABLE_MTLN: ${{ matrix.mtln }}
      run: python -m pytest -m 'not codemodel' test/ --durations=20 --junitxml=build/pytest-results.xml --basetemp=build/pytest-tmp

    - name: Run native tests
      id: native-tests
      continue-on-error: true
      run: build/bin/fdtd_tests.exe

    - name: Upload failed test diagnostics
      if: ${{ !cancelled() && (steps.ctest.outcome == 'failure' || steps.hdf-smoke.outcome == 'failure' || steps.python-tests.outcome == 'failure' || steps.native-tests.outcome == 'failure') }}
      uses: actions/upload-artifact@v4
      with:
        name: test-diagnostics-${{ matrix.mtln }}-${{ matrix.double-precision }}
        path: |
          build/pytest-results.xml
          build/hdf-smoke/**/*.json
        if-no-files-found: warn

    - name: Report test failures
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        if ("${{ steps.ctest.outcome }}" -ne "success" -or `
            "${{ steps.hdf-smoke.outcome }}" -ne "success" -or `
            "${{ steps.python-tests.outcome }}" -ne "success" -or `
            "${{ steps.native-tests.outcome }}" -ne "success") {
          exit 1
        }
        
