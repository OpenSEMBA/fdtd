name: windows


on:
  push:
    branches:
      - main

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  builds-and-tests:
    strategy:
      matrix:
        os: [windows-latest]
        compiler: [ 
          {name: 'intel', version: '2025.2.1'} 
        ]
        build-type: ["Release"]
        mpi: ["OFF"]
        mtln: ["ON", "OFF"]
        hdf: ["ON"]
        double-precision: ["ON", "OFF"]

      fail-fast: false
    runs-on: ${{matrix.os}}

    name: ${{matrix.os}} / ${{matrix.compiler.name}} / ${{matrix.build-type}}-mpi(${{matrix.mpi}})-mtln(${{matrix.mtln}})-hdf(${{matrix.hdf}})-double(${{matrix.double-precision}})

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    
    - name: Install python wrapper requirements
      run: python -m pip install -r requirements.txt
        
    #- name: Setup MPI
    #  uses: mpi4py/setup-mpi@v1
    #  with:
    #    mpi: 'intelmpi'

    - name: Setup intel fortran
      uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: ${{ matrix.compiler.name }}
        version: ${{ matrix.compiler.version }}

    - name: Setup ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    # CMake 4.4 cannot detect the ifx 2025.2 Fortran preprocessor on Windows.
    - name: Setup CMake
      uses: jurplel/install-cmake-action@v4
      with:
        version: '3.31.6'

    - name: CMake build
      shell: bash
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}} \
          -DSEMBA_FDTD_ENABLE_MPI=${{matrix.mpi}} \
          -DSEMBA_FDTD_ENABLE_HDF=${{matrix.hdf}} \
          -DSEMBA_FDTD_ENABLE_MTLN=${{matrix.mtln}} \
          -DSEMBA_FDTD_ENABLE_DOUBLE_PRECISION=${{matrix.double-precision}}
        cmake --build build -j 

    - name: Run ctest
      run: ctest --test-dir build --output-on-failure

    - name: Run python tests (except codemodel)
      env:
        SEMBA_FDTD_ENABLE_MPI: ${{ matrix.mpi }}
        SEMBA_FDTD_ENABLE_MTLN: ${{ matrix.mtln }}
        SEMBA_FDTD_ENABLE_HDF: ${{ matrix.hdf }}
      run: python -m pytest -m 'not codemodel' test/ --durations=20

    - name: Run native tests 
      run: build/bin/fdtd_tests.exe

        
